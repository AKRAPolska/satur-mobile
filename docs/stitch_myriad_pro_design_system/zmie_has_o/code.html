"••••••••" type="password"><button class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="toggleVisibility('new-password', this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility</span></button></div></div><div class="flex flex-col gap-stack-sm"><label class="font-label-md text-label-md text-on-surface-variant">Potwierdź nowe hasło</label><div class="relative flex items-center"><input class="w-full h-12 px-4 rounded-xl border border-border-light bg-surface-container-lowest text-body-md text-on-surface focus:outline-none focus:border-primary" id="confirm-password" placeholder="••••••••" type="password"><button class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="toggleVisibility('confirm-password', this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility</span></button></div></div><button class="mt-4 w-full h-12 rounded-xl text-on-primary font-headline-sm flex items-center justify-center gap-stack-sm shadow-lg transition-opacity bg-primary" id="submit-password-btn">Zmień hasło</button></div></div>
<script>
  function toggleVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  const submitBtn = document.getElementById('submit-password-btn');
  if (submitBtn) {
    submitBtn.addEventListener('click', function() {
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
        <span>Zapisywanie...</span>
      `;
      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-status-success text-[20px]">check_circle</span>
          <span>Hasło zaktualizowane!</span>
        `;
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }, 2000);
      }, 900);
    });
  }
</script></main>
